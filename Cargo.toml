[package]
name = "project-analyser"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "A read-only desktop inventory of local software projects"

[features]
default = ["gui"]
gui = ["dep:gpui", "dep:gpui-component"]

[[bin]]
name = "project-analyser"
path = "src/main.rs"
required-features = ["gui"]

[dependencies]
anyhow = "1"
directories = "6"
dunce = "1"
globset = "0.4"
gpui = { version = "=0.2.2", optional = true }
gpui-component = { version = "=0.5.1", optional = true }
ignore = "0.4"
roxmltree = "0.20"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
serde_yaml = "0.9"
tempfile = "3"
toml = "0.8"
url = "2"

[patch.crates-io]
# GPUI's tar dependency still requires xattr 0.2.x. See the patch notes in vendor/.
xattr = { path = "vendor/xattr-0.2.3" }

[lints.rust]
unsafe_code = "forbid"
