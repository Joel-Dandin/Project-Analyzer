[package]
name = "project-analyser"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "A read-only desktop inventory of local software projects"

[features]
default = ["gui"]
gui = ["dep:rfd", "dep:tao", "dep:wry"]

[[bin]]
name = "project-analyser"
path = "src/main.rs"
required-features = ["gui"]

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["now", "serde"] }
directories = "6"
dunce = "1"
globset = "0.4"
ignore = "0.4"
roxmltree = "0.20"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
serde_yaml = "0.9"
tempfile = "3"
toml = "0.8"
url = "2"

rfd = { version = "0.17.2", default-features = false, features = ["gtk3"], optional = true }
tao = { version = "0.37.2", default-features = false, features = ["rwh_06", "x11"], optional = true }
wry = { version = "0.57.1", default-features = false, features = ["os-webview"], optional = true }

[lints.rust]
unsafe_code = "forbid"
